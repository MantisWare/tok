name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          TOK_TELEMETRY_URL: ${{ vars.TOK_TELEMETRY_URL }}
          TOK_TELEMETRY_TOKEN: ${{ secrets.TOK_TELEMETRY_TOKEN }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../tok-${{ matrix.target }}.${{ matrix.archive }} tok
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../tok-${{ matrix.target }}.${{ matrix.archive }} tok.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tok-${{ matrix.target }}
          path: tok-${{ matrix.target }}.${{ matrix.archive }}

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB
        run: cargo deb
        env:
          TOK_TELEMETRY_URL: ${{ vars.TOK_TELEMETRY_URL }}
          TOK_TELEMETRY_TOKEN: ${{ secrets.TOK_TELEMETRY_TOKEN }}

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: tok-deb
          path: target/debian/*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release
        run: cargo build --release
        env:
          TOK_TELEMETRY_URL: ${{ vars.TOK_TELEMETRY_URL }}
          TOK_TELEMETRY_TOKEN: ${{ secrets.TOK_TELEMETRY_TOKEN }}

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: tok-rpm
          path: target/generate-rpm/*.rpm

  release:
    name: Create Release
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;

      - name: Create version-agnostic package names
        run: |
          cd release
          for f in *.deb; do
            [ -f "$f" ] && cp "$f" "tok_amd64.deb"
          done
          for f in *.rpm; do
            [ -f "$f" ] && cp "$f" "tok.x86_64.rpm"
          done

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo MantisWare/tok \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          echo "mac_arm=$(grep aarch64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "mac_intel=$(grep x86_64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm=$(grep aarch64-unknown-linux-gnu.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_intel=$(grep x86_64-unknown-linux-musl.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate formula
        env:
          TOK_VERSION: ${{ steps.version.outputs.version }}
          TOK_TAG: ${{ steps.version.outputs.tag }}
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_MAC_INTEL: ${{ steps.sha.outputs.mac_intel }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.linux_arm }}
          SHA_LINUX_INTEL: ${{ steps.sha.outputs.linux_intel }}
        run: |
          ruby -e '
            version = ENV["TOK_VERSION"]
            tag     = ENV["TOK_TAG"]
            puts <<~RUBY
              class Tok < Formula
                desc "Token Optimization Kit - High-performance CLI proxy to minimize LLM token consumption"
                homepage "https://github.com/MantisWare/tok"
                version "#{version}"
                license "MIT"

                if OS.mac? && Hardware::CPU.arm?
                  url "https://github.com/MantisWare/tok/releases/download/#{tag}/tok-aarch64-apple-darwin.tar.gz"
                  sha256 "#{ENV["SHA_MAC_ARM"]}"
                elsif OS.mac? && Hardware::CPU.intel?
                  url "https://github.com/MantisWare/tok/releases/download/#{tag}/tok-x86_64-apple-darwin.tar.gz"
                  sha256 "#{ENV["SHA_MAC_INTEL"]}"
                elsif OS.linux? && Hardware::CPU.arm?
                  url "https://github.com/MantisWare/tok/releases/download/#{tag}/tok-aarch64-unknown-linux-gnu.tar.gz"
                  sha256 "#{ENV["SHA_LINUX_ARM"]}"
                elsif OS.linux? && Hardware::CPU.intel?
                  url "https://github.com/MantisWare/tok/releases/download/#{tag}/tok-x86_64-unknown-linux-musl.tar.gz"
                  sha256 "#{ENV["SHA_LINUX_INTEL"]}"
                end

                def install
                  bin.install "tok"
                end

                def caveats; <<~CAVEATS

                    \u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2557  \u2588\u2588\u2588\u2588\u2588\u2588\u2557   \u2588\u2588\u2557  \u2588\u2588\u2557
                    \u255a\u2550\u2550\u2588\u2588\u2554\u2550\u2550\u255d \u2588\u2588\u2554\u2550\u2550\u2550\u2588\u2588\u2557  \u2588\u2588\u2551 \u2588\u2588\u2554\u255d
                       \u2588\u2588\u2551    \u2588\u2588\u2551   \u2588\u2588\u2551  \u2588\u2588\u2588\u2588\u2588\u2554\u255d
                       \u2588\u2588\u2551    \u2588\u2588\u2551   \u2588\u2588\u2551  \u2588\u2588\u2554\u2550\u2588\u2588\u2557
                       \u2588\u2588\u2551     \u255a\u2588\u2588\u2588\u2588\u2554\u255d   \u2588\u2588\u2551  \u2588\u2588\u2557
                       \u255a\u2550\u255d      \u255a\u2550\u2550\u2550\u255d    \u255a\u2550\u255d  \u255a\u2550\u255d

                  tok #{version} \u2014 Token Optimization Kit
                  Squeeze noisy CLI output before it hits your LLM

                \u2500\u2500 Quick Start \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

                  # 1. Install for your AI tool
                  tok init -g                  # Claude Code (recommended)
                  tok init -g --gemini         # Gemini CLI
                  tok init -g --codex          # Codex (OpenAI)
                  tok init -g --agent cursor   # Cursor

                  # 2. Restart your AI tool, then test
                  tok --version                # Verify installation
                  tok gain                     # View token savings

                \u2500\u2500 What It Does \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

                  tok sits between your shell and your LLM, filtering
                  command output for 60-90% token savings:

                  tok git status          # Compact status
                  tok cargo test          # Failures only (-90%)
                  tok ls .                # Token-optimized tree
                  tok grep "pattern" .    # Grouped results

                \u2500\u2500 Resources \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

                  Docs:   https://github.com/MantisWare/tok
                  Help:   tok --help
                  Issues: https://github.com/MantisWare/tok/issues

                CAVEATS
                end

                test do
                  system "\#{bin}/tok", "--version"
                end
              end
            RUBY
          ' > tok.rb

      - name: Push to homebrew-tap
        run: |
          CONTENT=$(base64 -w 0 tok.rb)
          SHA=$(gh api repos/MantisWare/homebrew-tap/contents/Formula/tok.rb --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/MantisWare/homebrew-tap/contents/Formula/tok.rb \
              -f message="tok ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api -X PUT repos/MantisWare/homebrew-tap/contents/Formula/tok.rb \
              -f message="tok ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT"
          fi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
